name: Property tests (nightly)

# The approval-pairing property tests (tests/Concerns/ApprovalPairingPropertyTest.php)
# run on every push and pull request with a small fixed-seed set, as part of
# Tests. This runs ONLY them, with a large example count and a seed taken from
# the run, so each night explores cases the fixed set does not. A failure prints
# the seed and the minimal case; replay it locally with
# PRISM_PROPERTY_SEED=<seed> vendor/bin/pest tests/Concerns/ApprovalPairingPropertyTest.php
#
# `schedule` only fires from the default branch. Core has no release line, so the
# ref matrix is main alone; add a release branch here when one exists.

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      examples:
        description: Examples per property
        required: false
        default: "5000"
      seed:
        description: Base seed (blank = derived from the run)
        required: false
        default: ""

permissions:
  contents: read

jobs:
  property:
    name: Property tests (${{ matrix.ref }})
    runs-on: ubuntu-latest
    needs: third-party
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        ref: [main]

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ matrix.ref }}
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: 8.4
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, gd, exif, iconv, imagick, fileinfo
          coverage: none

      - name: Install dependencies
        run: composer update --prefer-stable --prefer-dist --no-interaction

      - name: Choose the seed
        env:
          INPUT_SEED: ${{ github.event.inputs.seed }}
          INPUT_EXAMPLES: ${{ github.event.inputs.examples }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          REF: ${{ matrix.ref }}
        run: |
          # Blank means the default; anything else must be a whole number, or
          # the run fails rather than quietly running a different set.
          seed="$INPUT_SEED"
          case "$seed" in
            '') seed=$(( (RUN_ID * 31 + RUN_ATTEMPT) % 2147483647 )) ;;
            *[!0-9]*|??????????*) echo "::error::seed must be a whole number of at most 9 digits"; exit 1 ;;
          esac
          examples="$INPUT_EXAMPLES"
          case "$examples" in
            '') examples=5000 ;;
            *[!0-9]*|??????????*) echo "::error::examples must be a whole number of at most 9 digits"; exit 1 ;;
          esac
          if [ "$examples" -lt 1 ]; then
            echo "::error::examples must be at least 1"
            exit 1
          fi
          echo "PRISM_PROPERTY_BASE_SEED=$seed" >> "$GITHUB_ENV"
          echo "PRISM_PROPERTY_EXAMPLES=$examples" >> "$GITHUB_ENV"
          echo "Property run: ref $REF, base seed $seed, $examples examples per property"

      - name: Run the property tests
        run: vendor/bin/pest tests/Concerns/ApprovalPairingPropertyTest.php

  third-party:
    name: Third-party dependency allowlist
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # This job only reads files, so it keeps no token in .git/config for
      # the fetched checker to find.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # Every direct dependency must be approved on the org allowlist and still
      # maintained. The list is fetched, never vendored, so there is no copy here
      # to drift. This has to pass BEFORE a tag is pushed: Packagist publishes a
      # Composer package the moment its tag exists, so the release guard, which
      # requires this workflow to have succeeded, can only withhold the GitHub
      # release. It cannot withdraw a version.
      - name: Fetch the third-party allowlist
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: Particle-Academy/.github
          ref: d368b8173bc81562e0af4035b1cf6fcb207817f9
          path: .third-party-allowlist
          persist-credentials: false

      - name: Verify the pinned checkout
        # Generated by pin-github-checks.mjs -- edit the pin with that tool, not by
        # hand. The ref above is a commit SHA, and every file the fetched code reads
        # is hashed here, so a push to the source repo cannot change what runs in
        # this workflow until someone reviews it and re-pins. It runs from the
        # workspace with nothing preloaded, so neither the job's working-directory
        # nor a variable an earlier step left behind decides what it reads or runs.
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          NODE_OPTIONS: ''
          NODE_PATH: ''
          BASH_ENV: ''
          ENV: ''
          SHELLOPTS: ''
          BASHOPTS: ''
          LD_PRELOAD: ''
          LD_LIBRARY_PATH: ''
          LD_AUDIT: ''
          DYLD_INSERT_LIBRARIES: ''
          DYLD_LIBRARY_PATH: ''
          PIN_ROOT: .third-party-allowlist
          PIN_DIR: .third-party-allowlist/third-party
          PIN_SHA: d368b8173bc81562e0af4035b1cf6fcb207817f9
          PIN_SHA256: |
            1b97061617b07bffbccbe6aa76ecc7f8b16e74458a113c5032380aa966798498  check.mjs
            1547306d567749d7410040cae2bfb9a648902de95c3378f6c5af54245c896e11  gate-graph.mjs
            b89b1ac2b19857cac2319a83410958067dfda7621bf5821af440732b87982e8a  allowlist.json
        run: |
          node -e '
          const fs = require("node:fs");
          const crypto = require("node:crypto");
          const { execFileSync } = require("node:child_process");
          const env = process.env;
          const fail = [];
          const head = execFileSync("git", ["-C", env.PIN_ROOT, "rev-parse", "HEAD"], { encoding: "utf8" }).trim();
          if (head !== env.PIN_SHA) fail.push("checkout is at " + head + ", pinned " + env.PIN_SHA);
          const want = env.PIN_SHA256.split(String.fromCharCode(10)).map((l) => l.trim()).filter(Boolean);
          if (!want.length) fail.push("no file hashes are pinned");
          for (const entry of want) {
            const [hash, ...rest] = entry.split(" ").filter(Boolean);
            const file = rest.join(" ");
            let got = "missing";
            try {
              const text = fs.readFileSync(env.PIN_DIR + "/" + file, "latin1");
              const lf = text.split(String.fromCharCode(13, 10)).join(String.fromCharCode(10));
              got = crypto.createHash("sha256").update(lf, "latin1").digest("hex");
            } catch {}
            if (got !== hash) fail.push(file + " sha256 is " + got + ", pinned " + hash);
          }
          for (const f of fail) console.log("::error::Pinned checkout mismatch: " + f);
          if (fail.length) {
            console.log("::error::Refusing to run fetched code that does not match its pin. Review the upstream change, then re-pin with pin-github-checks.mjs.");
            process.exit(1);
          }
          console.log("Pinned checkout verified: " + head + ", " + want.length + " files match.");
          '

      - name: Third-party dependency allowlist
        run: |
          node .third-party-allowlist/third-party/check.mjs --repo .
          node -e "require('node:fs').rmSync('.third-party-allowlist',{recursive:true,force:true})"
